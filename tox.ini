[tox]
envlist = py{39,310,311,312,313}, lint, type
isolated_build = True
skip_missing_interpreters = True

[testenv]
description = Run tests with pytest
deps =
    pytest>=7.0.0
    numpy>=1.24.0
commands =
    pytest tests/ -v

[testenv:py313]
description = Run tests with Python 3.13
deps =
    pytest>=7.0.0
    numpy>=1.26.0

[testenv:lint]
description = Run code linting with ruff
deps =
    ruff>=0.1.0
commands =
    ruff check src/

[testenv:format]
description = Format code with ruff
deps =
    ruff>=0.1.0
commands =
    ruff format src/

[testenv:type]
description = Run type checking with mypy
deps =
    mypy>=1.0.0
    numpy>=1.24.0
commands =
    mypy src/

[testenv:coverage]
description = Run tests with coverage
deps =
    pytest>=7.0.0
    pytest-cov>=4.0.0
    numpy>=1.24.0
commands =
    pytest tests/ --cov=src/taocore --cov-report=term-missing --cov-report=html

[testenv:docs]
description = Build documentation (placeholder for future sphinx/mkdocs setup)
deps =
skip_install = True
commands =
    python -c "print('Documentation build not yet configured')"

[gh-actions]
python =
    3.9: py39
    3.10: py310
    3.11: py311
    3.12: py312
    3.13: py313
