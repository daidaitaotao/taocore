[project]
name = "taocore"
version = "0.1.0"
description = "Systems layer for stability, coherence, and dynamics analysis"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "TaoCore Contributors"},
]
maintainers = [
    {name = "TaoCore Contributors"},
]
keywords = [
    "graph",
    "dynamics",
    "equilibrium",
    "stability",
    "coherence",
    "temporal",
    "attention",
    "systems",
    "analysis",
    "metrics",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.24.0",
]

[project.urls]
Homepage = "https://github.com/yourusername/taocore"
Documentation = "https://github.com/yourusername/taocore#readme"
Repository = "https://github.com/yourusername/taocore"
Issues = "https://github.com/yourusername/taocore/issues"
Changelog = "https://github.com/yourusername/taocore/releases"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
    "tox>=4.0.0",
    "twine>=4.0.0",
    "build>=1.0.0",
]

[build-system]
requires = ["uv_build>=0.9.18,<0.10.0"]
build-backend = "uv_build"
