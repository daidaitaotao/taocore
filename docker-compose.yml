version: '3.8'

services:
  taocore:
    build:
      context: .
      dockerfile: Dockerfile
    image: taocore:latest
    container_name: taocore
    volumes:
      # Mount source for development
      - ./src:/app/src:ro
      - ./examples:/app/examples:ro
      - ./tests:/app/tests:ro
    environment:
      - PYTHONUNBUFFERED=1
    command: python examples/demo.py

  # Development service with tests
  taocore-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    image: taocore:dev
    container_name: taocore-dev
    volumes:
      - .:/app
    environment:
      - PYTHONUNBUFFERED=1
    command: /bin/bash
    stdin_open: true
    tty: true

  # Test runner
  taocore-test:
    build:
      context: .
      dockerfile: Dockerfile
    image: taocore:latest
    container_name: taocore-test
    volumes:
      - ./tests:/app/tests:ro
    environment:
      - PYTHONUNBUFFERED=1
    command: pytest tests/ -v
